name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint & format check ───────────────────────────────────────────────────
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hiero-waffles
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: hiero-waffles/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome lint
        run: pnpm lint

      - name: Biome format check
        run: pnpm biome format .

  # ─── Type-check ────────────────────────────────────────────────────────────
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hiero-waffles
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: hiero-waffles/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check all packages
        run: pnpm typecheck

  # ─── Test matrix ───────────────────────────────────────────────────────────
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    defaults:
      run:
        working-directory: hiero-waffles

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: hiero-waffles/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm -r test -- --coverage

      - name: Upload coverage
        if: matrix.node-version == 20
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: hiero-waffles/packages/*/coverage/lcov.info
          fail_ci_if_error: false

  # ─── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    defaults:
      run:
        working-directory: hiero-waffles
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: hiero-waffles/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Verify dist artefacts exist
        run: |
          for pkg in core mirror-node scheduled-tx react; do
            test -f "packages/$pkg/dist/index.js" || (echo "Missing dist for $pkg" && exit 1)
            test -f "packages/$pkg/dist/index.d.ts" || (echo "Missing types for $pkg" && exit 1)
          done
          echo "All dist artefacts present."

  # ─── DCO / commit sign-off check ───────────────────────────────────────────
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check DCO sign-off on all commits
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          MISSING=""
          while IFS= read -r commit; do
            msg=$(git log --format=%B -n 1 "$commit")
            if ! echo "$msg" | grep -qE "^Signed-off-by: .+ <.+>$"; then
              MISSING="$MISSING\n  $commit"
            fi
          done < <(git log --format=%H "$BASE..$HEAD")

          if [ -n "$MISSING" ]; then
            echo "::error::The following commits are missing a 'Signed-off-by' trailer:"
            printf "$MISSING\n"
            echo ""
            echo "Run: git commit --amend --signoff  (or git rebase --signoff)"
            exit 1
          fi
          echo "All commits have DCO sign-off."